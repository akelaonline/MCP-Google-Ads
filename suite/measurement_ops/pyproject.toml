[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mkt-measurement-ops"
version = "0.1.0"
description = "Measurement Operations orchestration for GTM, GA4, Google Ads and managed websites."
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=2.12,<3",
  "google-api-python-client>=2.150,<3",
  "google-auth>=2.35,<3",
  "google-analytics-data>=0.18",
]

[project.optional-dependencies]
oauth = [
  "google-auth-oauthlib>=1.2,<2",
]
web = [
  "playwright>=1.50,<2",
]
dev = [
  "pytest>=8,<9",
  "ruff==0.8.6",
]

[project.scripts]
mkt-measurement-ops = "mkt_measurement_ops.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mkt_measurement_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

# Keep lint policy explicit so future Ruff versions do not silently expand
# the rule set. Tool upgrades require a deliberate PR with a clean test gate.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
