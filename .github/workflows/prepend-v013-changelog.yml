name: Apply v0.13 changelog

on:
  push:
    branches:
      - agent/v0.13-production-policy
    paths:
      - .github/workflows/prepend-v013-changelog.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.13-production-policy
          fetch-depth: 0

      - name: Update changelog and remove one-shot machinery
        run: |
          python scripts/prepend_v013_changelog.py
          rm scripts/prepend_v013_changelog.py
          rm .github/workflows/prepend-v013-changelog.yml

      - name: Commit final documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: add v0.13.0 changelog entry'
          git push origin HEAD:agent/v0.13-production-policy
