name: Finalize v0.14 docs

on:
  push:
    branches:
      - agent/v0.14-agency-coverage
    paths:
      - .github/workflows/finalize-v0.14-docs.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.14-agency-coverage
          fetch-depth: 0

      - name: Apply final documentation and remove one-shot machinery
        run: |
          python scripts/finalize_v014_docs.py
          rm scripts/finalize_v014_docs.py
          rm .github/workflows/finalize-v0.14-docs.yml

      - name: Commit final documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: finalize v0.14.0 agency coverage'
          git push origin HEAD:agent/v0.14-agency-coverage
