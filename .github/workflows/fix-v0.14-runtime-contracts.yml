name: Fix v0.14 runtime contracts

on:
  push:
    branches:
      - agent/v0.14-agency-coverage
    paths:
      - .github/workflows/fix-v0.14-runtime-contracts.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.14-agency-coverage
          fetch-depth: 0

      - name: Apply runtime contract fixes and remove one-shot machinery
        run: |
          python scripts/fix_v014_runtime_contracts.py
          rm scripts/fix_v014_runtime_contracts.py
          rm .github/workflows/fix-v0.14-runtime-contracts.yml

      - name: Commit runtime contract fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: align singular mutate and invoice month contracts'
          git push origin HEAD:agent/v0.14-agency-coverage
