name: Publish v0.12.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.12.0.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="v0.12.0 — Google Ads API v25 Compatibility & Hardening"
          if gh release view v0.12.0 >/dev/null 2>&1; then
            gh release edit v0.12.0 \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file docs/RELEASE_0.12.0.md
          else
            gh release create v0.12.0 \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file docs/RELEASE_0.12.0.md
          fi

      - name: Best-effort repository About metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api --method PATCH "repos/$GITHUB_REPOSITORY" \
            -f description='Full-lifecycle Google Ads MCP server — API v25, read/write campaign management, PMax, Demand Gen, conversions, MCC, atomic mutations, approvals & audit logging.'
          gh api --method PUT "repos/$GITHUB_REPOSITORY/topics" \
            -H 'Accept: application/vnd.github+json' \
            --input - <<'JSON'
          {"names":["mcp","model-context-protocol","google-ads","google-ads-api","google-ads-automation","ai-agents","fastmcp","python","ppc","performance-max"]}
          JSON
          exit 0
