name: Apply v0.12.1 video hotfix

on:
  push:
    branches:
      - agent/v0.12.1-video-hotfix
    paths:
      - .github/workflows/apply-v0.12.1-video-hotfix.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.12.1-video-hotfix
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply patch
        run: python scripts/apply_v0121_hotfix.py

      - name: Install and validate
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          python -m pip check
          python scripts/smoke_test.py
          ruff check src tests scripts
          pytest tests/ -q

      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/google_ads_mcp/tools/ads.py src/google_ads_mcp/__init__.py pyproject.toml README.md docs/TOOLS.md CHANGELOG.md docs/RELEASE_0.12.1.md tests/test_video_v25_hotfix.py
          git commit -m 'fix: block legacy video writes and add Demand Gen video'
          git push origin HEAD:agent/v0.12.1-video-hotfix
