[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "google-ads-mcp"
version = "0.17.0"
description = "Production-grade read/write MCP server for Google Ads API v25 with confirmation, audit, durable replay, and MCC customer isolation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Akela" }
]
keywords = ["mcp", "google-ads", "claude", "ai-agent", "advertising"]
dependencies = [
    "google-ads>=31.2.0,<32.0.0",
    "fastmcp>=2.3.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.14", "ruff>=0.16"]
auth = ["google-auth-oauthlib>=1.2.0"]

[project.scripts]
google-ads-mcp = "google_ads_mcp.server:main"

[project.urls]
Homepage = "https://github.com/akelaonline/MCP-Google-Ads"
Repository = "https://github.com/akelaonline/MCP-Google-Ads"
Changelog = "https://github.com/akelaonline/MCP-Google-Ads/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
